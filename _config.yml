# Site settings for 30adigitalmarketing.com
# After editing this file, GitHub rebuilds the site automatically.

title: 30A Digital Marketing
url: "https://30adigitalmarketing.com"
baseurl: ""
lang: en

# Blog posts live at /insights/post-name/ (no dates in the address)
permalink: /insights/:title/

# Google Search Console ownership proof (a public code, not a password). Keep it in place.
google_site_verification: "KBaAAdaAzGmsn8_J8tLGFFQKIzGNaxU3mCLegUAXVl8"

# Google Analytics. Currently OFF. To turn on, delete the "#" and the space at the start of the next line.
# google_analytics_id: "G-S8BG7ZJ2PZ"

# Builds sitemap.xml automatically
plugins:
  - jekyll-sitemap

# Files that are for us, not for the public website
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
